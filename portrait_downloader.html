document.getElementById('cnt').textContent = ITEMS.length;
const log = document.getElementById('log'), fill = document.getElementById('fill');
function addLog(t){ log.textContent += t + '\n'; log.scrollTop = log.scrollHeight; }
let dirHandle = null;
document.getElementById('go').addEventListener('click', async () => {
  try {
    dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
  } catch(e){ addLog('❌ 未授权目录：' + e.message); return; }
  document.getElementById('go').disabled = true;
  await runAll();
});
document.getElementById('retry').addEventListener('click', async () => { document.getElementById('retry').style.display='none'; await runAll(); });

async function runAll(){
  let ok=0, fail=0; const fails=[];
  for(let i=0;i<ITEMS.length;i++){
    const it=ITEMS[i];
    fill.style.width = ((i/ITEMS.length)*100) + '%';
    try {
      const resp = await fetch(it.url, {mode:'cors'});
      if(!resp.ok){ throw new Error('HTTP '+resp.status); }
      const blob = await resp.blob();
      // 根据 content-type 或 URL 决定扩展名
      let ext='jpg'; const ct=blob.type;
      if(ct.includes('png')) ext='png';
      else if(ct.includes('jpeg')||ct.includes('jpg')) ext='jpg';
      else if(ct.includes('webp')) ext='webp';
      const fname = it.id + '.' + ext;
      const fh = await dirHandle.getFileHandle(fname, {create:true});
      const w = await fh.createWritable();
      await w.write(blob); await w.close();
      ok++; addLog('✅ ' + it.name + ' → ' + fname);
    } catch(e){
      fail++; fails.push(it.name + '(' + it.id + ')');
      addLog('❌ ' + it.name + ': ' + e.message);
    }
  }
  fill.style.width='100%';
  addLog('\n===== 完成：成功 ' + ok + '，失败 ' + fail + ' =====');
  if(fail>0){ document.getElementById('retry').style.display='inline-block'; addLog('失败列表：' + fails.join('、')); }
}
</script>
