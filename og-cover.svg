  <text x="600" y="278" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="74" font-weight="700" fill="#f1f5f9" text-anchor="middle" letter-spacing="2">智识星球 Philomap</text>
  <text x="600" y="356" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="28" fill="#a5b4c8" text-anchor="middle" letter-spacing="10">在群星闪耀时，发现思想的引力</text>
  <text x="600" y="548" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="20" fill="#64748b" text-anchor="middle" letter-spacing="3">人类思想星图 · 102 位哲人 · 跨越 2600 年</text>
